<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Memory Graph</title>
<script src="vis-network.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #27303b; --ink: #e6edf3;
    --ink-2: #8b949e; --accent: #58a6ff;
    --user: #f2cc60; --feedback: #db61a2; --project: #58a6ff;
    --reference: #3fb950; --other: #a371f7; --missing: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); display: flex;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  aside {
    width: 320px; flex: none; border-right: 1px solid var(--line);
    padding: 18px; overflow-y: auto; background: var(--panel);
  }
  h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .2px; }
  .sub { color: var(--ink-2); font-size: 12px; margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat { background: #0d1117; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .stat b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink-2); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  input[type=search] {
    width: 100%; padding: 8px 10px; border-radius: 6px; margin-bottom: 14px;
    background: #0d1117; border: 1px solid var(--line); color: var(--ink);
  }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px;
    background: #0d1117;
  }
  .chip.off { opacity: .35; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  #detail { border-top: 1px solid var(--line); padding-top: 14px; }
  #detail h2 { font-size: 14px; margin: 0 0 2px; }
  #detail .meta { color: var(--ink-2); font-size: 12px; margin-bottom: 10px; word-break: break-all; }
  #detail p { margin: 0 0 12px; }
  #detail ul { margin: 0; padding-left: 16px; }
  #detail li { cursor: pointer; }
  #detail li:hover { color: var(--accent); text-decoration: underline; }
  .tag {
    display: inline-block; border-radius: 4px; padding: 1px 6px; font-size: 11px;
    text-transform: uppercase; letter-spacing: .05em; color: #0d1117; font-weight: 600;
  }
  main { flex: 1; position: relative; }
  #net { position: absolute; inset: 0; }
  #err { padding: 24px; color: var(--missing); }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    aside { width: 100%; max-height: 46vh; border-right: none; border-bottom: 1px solid var(--line); }
    main { flex: 1; min-height: 54vh; }
  }
</style>
</head>
<body>
<aside>
  <h1>Claude Memory Graph</h1>
  <div class="sub" id="src">loading…</div>
  <div class="stats" id="stats"></div>
  <input type="search" id="q" placeholder="Search a memory…" autocomplete="off">
  <div class="legend" id="legend"></div>
  <div id="detail"><p class="sub">Click a node to see what it holds.</p></div>
</aside>
<main><div id="net"></div><div id="err" hidden></div></main>

<script>
const COLOR = { user: "#f2cc60", feedback: "#db61a2", project: "#58a6ff",
                reference: "#3fb950", other: "#a371f7", missing: "#f85149" };
const state = { hidden: new Set(), graph: null, net: null };

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function stats(g) {
  const s = g.stats;
  document.getElementById("src").textContent =
    `${s.memories} memories · generated ${String(s.generated).slice(0, 10)}`;
  const cells = [["memories", s.memories], ["links", s.links],
                 ["dangling links", s.dangling], ["not in index", s.orphans]];
  document.getElementById("stats").innerHTML = cells
    .map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
}

function legend(g) {
  const types = [...new Set(g.nodes.map((n) => n.type))].sort();
  document.getElementById("legend").innerHTML = types.map((t) =>
    `<span class="chip" data-type="${esc(t)}"><i class="dot" style="background:${COLOR[t] || COLOR.other}"></i>${esc(t)}</span>`
  ).join("");
  document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
    const t = c.dataset.type;
    state.hidden.has(t) ? state.hidden.delete(t) : state.hidden.add(t);
    c.classList.toggle("off");
    draw();
  }));
}

function detail(id) {
  const g = state.graph;
  const n = g.nodes.find((x) => x.id === id);
  if (!n) return;
  const links = g.edges
    .filter((e) => e.from === id || e.to === id)
    .map((e) => (e.from === id ? e.to : e.from));
  const el = document.getElementById("detail");
  el.innerHTML = `
    <h2>${esc(n.label)}</h2>
    <div class="meta">
      <span class="tag" style="background:${COLOR[n.type] || COLOR.other}">${esc(n.type)}</span>
      ${n.orphan ? ' <span class="tag" style="background:#f85149">not in MEMORY.md</span>' : ""}
      ${n.missing ? " no file behind this link" : `<br>${esc(n.file)}${n.modified ? " · " + esc(n.modified) : ""}`}
    </div>
    ${n.description ? `<p>${esc(n.description)}</p>` : ""}
    ${links.length ? `<p class="sub">Linked to</p><ul>${
      [...new Set(links)].map((l) => `<li data-go="${esc(l)}">${esc(l)}</li>`).join("")}</ul>` : `<p class="sub">No link.</p>`}`;
  el.querySelectorAll("[data-go]").forEach((li) => li.addEventListener("click", () => {
    state.net.selectNodes([li.dataset.go]);
    state.net.focus(li.dataset.go, { scale: 1.1, animation: true });
    detail(li.dataset.go);
  }));
}

function draw() {
  const g = state.graph;
  const keep = g.nodes.filter((n) => !state.hidden.has(n.type));
  const ids = new Set(keep.map((n) => n.id));
  const nodes = keep.map((n) => ({
    id: n.id,
    label: n.label,
    value: 1 + n.degree,
    shape: n.missing ? "diamond" : "dot",
    color: {
      background: n.missing ? "#0d1117" : COLOR[n.type] || COLOR.other,
      border: COLOR[n.type] || COLOR.other,
      highlight: { background: "#fff", border: COLOR[n.type] || COLOR.other },
    },
    borderWidth: n.orphan ? 3 : 1,
    shapeProperties: n.orphan ? { borderDashes: [4, 3] } : {},
    font: { color: "#e6edf3", size: 13, face: "-apple-system, sans-serif" },
  }));
  const edges = g.edges.filter((e) => ids.has(e.from) && ids.has(e.to))
    .map((e) => ({ ...e, color: { color: "#30363d", highlight: "#58a6ff" }, width: 1 }));

  state.net = new vis.Network(document.getElementById("net"), { nodes, edges }, {
    nodes: { scaling: { min: 8, max: 34, label: { min: 12, max: 20 } } },
    edges: { smooth: { type: "continuous" } },
    interaction: { hover: true, tooltipDelay: 150 },
    physics: {
      solver: "forceAtlas2Based",
      forceAtlas2Based: { gravitationalConstant: -58, springLength: 110, springConstant: 0.05 },
      stabilization: { iterations: 260 },
    },
  });
  state.net.on("click", (p) => { if (p.nodes.length) detail(p.nodes[0]); });
}

document.getElementById("q").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q || !state.net) return;
  const hit = state.graph.nodes.find((n) =>
    n.label.toLowerCase().includes(q) || (n.description || "").toLowerCase().includes(q));
  if (!hit) return;
  state.net.selectNodes([hit.id]);
  state.net.focus(hit.id, { scale: 1.1, animation: true });
  detail(hit.id);
});

fetch("graph.json")
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((g) => {
    state.graph = g;
    stats(g); legend(g); draw();
  })
  .catch((e) => {
    document.getElementById("net").hidden = true;
    const err = document.getElementById("err");
    err.hidden = false;
    err.textContent = `graph.json could not be loaded (${e.message}). Run: npx github:sacha9214/claude-memory-graph`;
  });
</script>
</body>
</html>
